name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure restricted SSH deployment
        env:
          SSH_KEY: ${{ secrets.ROOT_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ROOT_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish landing page without touching project directories
        run: |
          # The key is jailed to coziahr.com's document root. Deliberately do
          # not use --delete: /projects and any other independently deployed
          # applications share the same document root and must be preserved.
          timeout 60s rsync --recursive --verbose --times --compress --timeout=30 \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15' \
            website/ tobin@coziahr.com:.

      - name: Remove the retired Forever Free subdirectory
        run: |
          # Scope deletion to the former site directory only. The empty source
          # removes its contents without exposing any sibling directory to
          # rsync's --delete behavior.
          mkdir legacy-empty
          timeout 60s rsync --recursive --delete --timeout=30 \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15' \
            legacy-empty/ tobin@coziahr.com:foreverfree/
          timeout 60s rsync --recursive --timeout=30 \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15' \
            .github/retired/foreverfree/ tobin@coziahr.com:foreverfree/

      - name: Verify landing page and existing projects
        run: |
          curl --fail --silent --show-error --retry 3 https://coziahr.com/ >/dev/null
          curl --fail --silent --show-error --retry 3 https://coziahr.com/admin/ >/dev/null
          curl --fail --silent --show-error --retry 3 https://coziahr.com/api/projects.php >/dev/null
          curl --fail --silent --show-error --retry 3 https://coziahr.com/projects/tikitorch/ >/dev/null
          curl --fail --silent --show-error --retry 3 https://coziahr.com/projects/intervaltimer/ >/dev/null
          curl --fail --silent --show-error --retry 3 https://tikipassport.coziahr.com/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://coziahr.com/foreverfree/)" = "410"
